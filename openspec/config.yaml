schema: spec-driven

context: |
  Language: Chinese
  与 Owner 沟通及面向人阅读的产物正文使用中文。
  OpenSpec 结构标题、SHALL/MUST 关键字、机器字段与代码标识符按模板保留。
  项目：MenDi，TypeScript CLI；实际角色由当前会话或 Owner 指定。
  产品总设计与开发规划：mendi-foundation-and-delivery-roadmap.md。
  具体规格、方案和任务在对应 OpenSpec Change 中细化。
  角色、授权、核心 proof、Action / Skills 与 Runs 协作遵循根目录 AGENTS.md。
  MVP-D01 已人工 Close，manifest 位于 .mendi/delivery-groups/20261009-01-single-change-manual-collaboration/manifest.json。
  归档 ID 使用 YYYY-MM-DD-NNN-change-id，NNN 按项目累计成功归档跨 Delivery 增长，与 Run 编号分开；项目入口保存 archivedChangeCount，binding 保存 archiveOrdinal。
  探索材料统一保存于 Run / artifacts，不再新建 Change 级 explore.md；已有受审旧文件原样保留，有效决策收敛到正式方案。
  CLI 已实现首次 delivery open、首个已有 Change 的 bind、status / next、action start / continue / instructions / resolve、run save / submit 和 workspace diagnose；save 与 diagnose 仅本地，resolve 支持 Apply 与显式较早阶段回退，action archive 分 execute / local-only finish，诊断不解除锁。记录命令不自动执行阶段语义工作，Author 验证不替代 Reviewer 批准或 Archive。
  必要输入按操作区分；历史说明与未知 Ref 不成为查询运行依赖。人工归档后的查询不补建旧目录或调用旧 Change 活动 status。相关既有规格为 project-entry 和 delivery-workspace。
  当前 MVP-D01 已在 Owner 授权的 042 Delivery Close 完成人工收口，state=closed；A / B / C / D 已归档，累计完成数 4，无活动 Change。041 人工 Full Test 的 check、117/117、三份主规格严格校验及归档读回结果仍适用。等待 Owner 明确后续范围与独立授权；详情由 manifest 最近 Run 定位。
  D02、D03 仅为计划分组；产品级 Full Test / Close / Reopen 命令尚未实现，本次人工收口不等同其能力完成。本轮未执行 Git、Reopen 或下一 Change。
  Run 布局遵循路线图 §4.1：Delivery 操作与 NNN-changes 批次同级，批次内按 Change 保存多个 Run。
  正常范围内修复不因修复本身新增 Action / Run；本次复用 003-changes，整个 Delivery 实际 Run 连续编号。
  Storybook 归有 UI 的目标项目，接入按路线图安排，不是当前 CLI 的依赖。

operations:
  apply:
    guidance:
      - 先执行当前修改需要的 focused 检查，验证结果简洁留痕。
      - 独立 Reviewer 给出审核结论，工具成功或任务全勾不替代批准。
  archive:
    guidance:
      - 核对当前批准与实际归档效果，保留简短收口说明。
      - 不自动执行 Git、下一 Change 或 Delivery Full Test。
